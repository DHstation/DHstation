name: Gerar animacao da snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar os SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%237C3AED&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%23a78bfa,%237c3aed
            dist/snake-dark.svg?color_snake=%23A855F7&color_dots=%23161b22,%233c2a5e,%236b3fa0,%239d5fe0,%23c77dff
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}

      - name: Publicar na branch output
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Atualiza animacao da snake [skip ci]"
